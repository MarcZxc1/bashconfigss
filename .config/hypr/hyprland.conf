
# Windows-like Hyprland v0.55.2 Configuration

### --- MONITOR CONFIG ---
# Replace with your actual monitor names (e.g., HDMI-A-1, eDP-1)
monitor=,preferred,auto,auto

### --- STARTUP ---
# 1. Critical UI (Load Immediately)
exec-once = ~/.config/hypr/scripts/set_theme.sh
exec-once = waybar &
exec-once = awww-daemon
exec-once = mako -c ~/.config/hypr/mako/config
# (Wait 1 second for daemon to initialize before loading image)
exec-once = sleep 1 && awww img ~/.config/hypr/ARCH.avif

# 2. System Daemons (Wait 2 seconds)
exec-once = sleep 2 && ~/.config/hypr/scripts/monitor_daemon.sh &
exec-once = sleep 2 && ~/.config/hypr/scripts/window_open_focus.sh &
exec-once = sleep 2 && hypridle

# 3. Heavy Background Applets (Wait 4 seconds so UI doesn't freeze)
exec-once = sleep 4 && gnome-keyring-daemon --start --components=secrets
exec-once = ~/.config/hypr/scripts/battery_notify.sh &
exec-once = sleep 4 && gnome-clocks --gapplication-service &
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &
exec-once = sleep 5 && nm-applet --indicator
exec-once = sleep 5 && blueman-applet
exec-once = sleep 6 && udiskie &

### --- GENERAL & LAYOUT ---
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 1
    col.active_border = rgba(888888ee)
    col.inactive_border = rgba(444444aa)
    layout = dwindle
}

dwindle {
    preserve_split = 1
    force_split = 2 # Split right/down like Windows
    smart_split = 0
    smart_resizing = 1
}

# No gaps when only one window is open
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0

decoration {
    rounding = 8

    shadow {
        enabled = 0
    }

    blur {
        enabled = 0
    }
}

animations {
    enabled = 1
    bezier = lightning, 0.1, 2.5, 0.1, -0.5
    
    # Disable standard animations (instant UI)
    animation = windows, 0
    animation = border, 0
    animation = fade, 0
    animation = workspaces, 0
    animation = specialWorkspace, 0

    # Retain ONLY notification/OSD animations
    animation = layersIn, 1, 2, lightning, popin 80%
    animation = layersOut, 1, 3, default, slide
}

layerrule = animation popin, match:namespace ^(mako)$
layerrule = animation none, match:namespace ^(rofi)$
layerrule = animation none, match:namespace ^(waybar)$
layerrule = animation none, match:namespace ^(awww-daemon)$

### --- INPUT ---
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = 1
        tap-to-click = 1
        middle_button_emulation = 1
        disable_while_typing = 1
        drag_lock = 1
        clickfinger_behavior = 1
        scroll_factor = 1.0
        tap-and-drag = 1
    }
}

# Keep the pointer exactly where the user left it when focus or workspaces
# change. In particular, opening the centered Rofi Alt-Tab layer must not warp
# the pointer into a row and trigger hover selection by itself.
cursor {
    no_warps = true
    warp_on_change_workspace = 0
    warp_on_toggle_special = 0
}

### --- TOUCHPAD GESTURES ---
# 3-finger horizontal swipe: switch workspaces
gesture = 3, horizontal, workspace

# 3-finger vertical swipe up: toggle fullscreen
gesture = 3, up, fullscreen

# 3-finger vertical swipe down: toggle special workspace
gesture = 3, down, special

# 4-finger horizontal swipe: switch workspaces
gesture = 4, horizontal, workspace

### --- THEME ---
env = GTK_THEME,Arc-Dark
env = XDG_MENU_PREFIX,arch-
env = QT_QPA_PLATFORMTHEME,gtk3
env = COLOR_SCHEME,prefer-dark

#MOUSE SHI
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Adwaita
env = HYPRCURSOR_SIZE,24

### --- KEYBINDINGS (WINDOWS-STYLE) ---
$mainMod = SUPER

# Core Apps
bind = $mainMod, Q, exec, kitty
bind = $mainMod, E, exec, thunar
bind = $mainMod, R, exec, rofi -show drun
bind = $mainMod, F, togglefloating,
bind = $mainMod, C, killactive,
bind = $mainMod, B, exec, brave-origin-nightly
bind = $mainMod, W, exec, killall -SIGUSR1 waybar
bind = $mainMod, K, exec, kitty
bind = $mainMod, D, exec, discord
bind = $mainMod, G, exec, ~/.config/hypr/scripts/sleep_animation.sh
bind = $mainMod, N, exec, ~/.config/hypr/scripts/toggle_night.sh
bind = $mainMod, X, exec, ~/.config/hypr/scripts/power_menu.sh
bind = $mainMod SHIFT, F, exec, ~/.config/hypr/scripts/fan_control.sh
bind = $mainMod, P, exec, ~/.config/hypr/scripts/display_manager.sh
bind = $mainMod, J, exec, ~/.config/hypr/scripts/cursor_selector.sh
bind = $mainMod, L, exec, loginctl lock-session

# Minimize / Restore (one hidden window at a time)
bind = $mainMod, H, exec, ~/.config/hypr/scripts/minimize_toggle.sh minimize
bind = $mainMod SHIFT, H, exec, ~/.config/hypr/scripts/minimize_toggle.sh restore

# Scratchpad (Floating Terminal)
bind = $mainMod, T, togglespecialworkspace, scratchpad
bind = $mainMod SHIFT, T, movetoworkspacesilent, special:scratchpad

# Focus Navigation (Super+Arrow)
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d

# Move Windows (Super+Shift+Arrow)
bind = $mainMod SHIFT, Left, movewindow, l
bind = $mainMod SHIFT, Right, movewindow, r
bind = $mainMod SHIFT, Up, movewindow, u
bind = $mainMod SHIFT, Down, movewindow, d

# Maximize / Restore
bind = $mainMod, M, exec, ~/.config/hypr/scripts/fullscreen_raise.sh 0
bind = $mainMod SHIFT, M, exec, ~/.config/hypr/scripts/fullscreen_raise.sh 1

# Non-consuming bind passes repeated Alt+Tab presses into the existing Rofi.
# The previous window is preselected; releasing Alt commits it immediately.
bindn = ALT, Tab, exec, ~/.config/hypr/scripts/smart_alttab.sh
bindn = ALT SHIFT, Tab, exec, ~/.config/hypr/scripts/smart_alttab.sh --reverse
bindrl = ALT, Alt_L, exec, ~/.config/hypr/scripts/alttab_modifier_release.sh
bindrl = ALT, Alt_R, exec, ~/.config/hypr/scripts/alttab_modifier_release.sh

# Force the active window back into Hyprland's default tiled layout.
# This also leaves maximized/fullscreen mode before tiling the window.
bind = $mainMod SHIFT, Space, exec, bash ~/.config/hypr/scripts/force_tile.sh

# Workspaces (Virtual Desktops)
bind = $mainMod CTRL, Left, workspace, -1
bind = $mainMod CTRL, Right, workspace, +1
bind = $mainMod CTRL, D, workspace, empty
bind = $mainMod CTRL SHIFT, D, movetoworkspace, empty
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace (Silent = Like Windows)
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Move window AND follow (Shift+Ctrl)
bind = $mainMod SHIFT CTRL, 1, movetoworkspace, 1
bind = $mainMod SHIFT CTRL, 2, movetoworkspace, 2
bind = $mainMod SHIFT CTRL, 3, movetoworkspace, 3
bind = $mainMod SHIFT CTRL, 4, movetoworkspace, 4
bind = $mainMod SHIFT CTRL, 5, movetoworkspace, 5

# Rofi workspace selector (separate from the Alt+Tab app selector).
bindn = $mainMod, Tab, exec, ~/.config/hypr/scripts/workspace_switcher.sh
bindn = $mainMod SHIFT, Tab, exec, ~/.config/hypr/scripts/workspace_switcher.sh
bindrl = $mainMod, Super_L, exec, ~/.config/hypr/scripts/workspace_modifier_release.sh
bindrl = $mainMod, Super_R, exec, ~/.config/hypr/scripts/workspace_modifier_release.sh

# Grouping / Tabbed Windows
bind = $mainMod, Z, togglegroup
bind = ALT, Right, changegroupactive, f
bind = ALT, Left, changegroupactive, b

# Audio / Volume Control
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+ && wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && ~/.config/hypr/scripts/volume_osd.sh
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%- && wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && ~/.config/hypr/scripts/volume_osd.sh
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && ~/.config/hypr/scripts/volume_osd.sh
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Media Control
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Brightness Control
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 2%+ && ~/.config/hypr/scripts/brightness_osd.sh
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 2%- && ~/.config/hypr/scripts/brightness_osd.sh

# Fallback Keybindings (Super + Function Keys)
bindel = $mainMod, F12, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+ && wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && ~/.config/hypr/scripts/volume_osd.sh
bindel = $mainMod, F11, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%- && wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && ~/.config/hypr/scripts/volume_osd.sh
bindl = $mainMod, F10, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && ~/.config/hypr/scripts/volume_osd.sh
bindel = $mainMod, F6, exec, brightnessctl s 2%+ && ~/.config/hypr/scripts/brightness_osd.sh
bindel = $mainMod, F5, exec, brightnessctl s 2%- && ~/.config/hypr/scripts/brightness_osd.sh
bindl = $mainMod, F8, exec, playerctl play-pause
bindl = $mainMod, F9, exec, playerctl next
bindl = $mainMod, F7, exec, playerctl previous

# Screenshots
bind = $mainMod, U, exec, grim -g "$(slurp)" - | tee ~/Pictures/Screenshots/screenshot_$(date +'%Y-%m-%d_%H-%M-%S').png | wl-copy
bind = $mainMod SHIFT, U, exec, grim - | tee ~/Pictures/Screenshots/screenshot_$(date +'%Y-%m-%d_%H-%M-%S').png | wl-copy

# Mouse Binds (Move/Resize with Super + Left/Right click)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Resize windows with Super+Ctrl+HJKL
bind = $mainMod CTRL, H, resizeactive, -40 0
bind = $mainMod CTRL, L, resizeactive, 40 0
bind = $mainMod CTRL, K, resizeactive, 0 -40
bind = $mainMod CTRL, J, resizeactive, 0 40

### --- WINDOW RULES (v0.55.2 Syntax) ---

# Windows/Zorin-style default: stack normal apps as full-work-area floating
# windows. Alt+Tab raises one app at a time without exposing the tiling tree.
# window_open_focus.sh trims these to Waybar's reserved work area on launch.
windowrule = float 1, match:class ^(.*)$
windowrule = size 100% 100%, match:class ^(.*)$
windowrule = center 1, match:class ^(.*)$

# Floating common apps (kept for clarity and app-specific overrides)
windowrule = float 1, match:class ^(pavucontrol)$
windowrule = float 1, match:class ^(nm-applet)$
windowrule = float 1, match:class ^(blueman-manager)$
windowrule = float 1, match:class ^(gnome-calculator)$
windowrule = float 1, match:class ^(org.gnome.Calculator)$
windowrule = float 1, match:title ^(About).*$
windowrule = size 70% 70%, match:class ^(pavucontrol|blueman-manager|gnome-calculator|org.gnome.Calculator)$
windowrule = center 1, match:class ^(pavucontrol|blueman-manager|gnome-calculator|org.gnome.Calculator)$
windowrule = size 55% 55%, match:title ^(About).*$
windowrule = center 1, match:title ^(About).*$

# Steam (Complex Match)
windowrule {
    name = "steam-friends"
    match:class = "^(Steam)$"
    match:title = "^(Friends List)$"
    float = 1
}

# Image Viewers
windowrule = float 1, match:class ^(imv)$
windowrule = float 1, match:class ^(eog)$
windowrule = size 800 600, match:class ^(imv)$
windowrule = center 1, match:class ^(imv)$

# Video Players
windowrule = float 1, match:class ^(mpv)$
windowrule = float 1, match:class ^(vlc)$
windowrule = keep_aspect_ratio 1, match:class ^(mpv)$

# Scratchpad
windowrule = float 1, match:workspace ^(special:scratchpad)$
windowrule = size 80% 85%, match:workspace ^(special:scratchpad)$
windowrule = center 1, match:workspace ^(special:scratchpad)$

# Waybar Popups (Clocks)
windowrule = workspace special:clock_popup, match:class ^(org.gnome.clocks)$
windowrule = float 1, match:class ^(org.gnome.clocks)$
windowrule = size 500 400, match:class ^(org.gnome.clocks)$
windowrule = move 31.7% 35, match:class ^(org.gnome.clocks)$
windowrule = animation popin, match:class ^(org.gnome.clocks)$

# Persistent Workspaces (Windows-like)
workspace = 1, persistent:true, name:Desktop 1
workspace = 2, persistent:true, name:Desktop 2



### --- MISC ---
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = 0x1a1b26
    focus_on_activate = true
    on_focus_under_fullscreen = 2
    exit_window_retains_fullscreen = false
}
