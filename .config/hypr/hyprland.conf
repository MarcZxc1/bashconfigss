
# Windows-like Hyprland v0.55.2 Configuration

### --- MONITOR CONFIG ---
# Replace with your actual monitor names (e.g., HDMI-A-1, eDP-1)
monitor=,preferred,auto,auto

### --- STARTUP ---
exec-once = ~/.config/hypr/scripts/set_theme.sh
exec-once = waybar
exec-once = hypridle
exec-once = awww-daemon
exec-once = awww img ~/.config/hypr/arch1-wallpaper.jpg
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = udiskie
exec-once = dunst
# hyprswitch daemon for Alt+Tab overlay
exec-once = hyprswitch init --show-title &
exec-once = gnome-keyring-daemon --start --components=secrets

### --- GENERAL & LAYOUT ---
general {
    gaps_in = 4
    gaps_out = 0
    border_size = 0
    layout = dwindle
}

dwindle {
    preserve_split = 1
    force_split = 2 # Split right/down like Windows
}

decoration {
    rounding = 8
    
    shadow {
        enabled = 1
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = 1
        size = 3
        passes = 1
    }
}

animations {
    enabled = 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 4, overshot, slide
    animation = border, 1, 10, default
    animation = fade, 1, 4, default
    # Horizontal slide for workspace switching (Windows-like)
    animation = workspaces, 1, 5, default, slide
}

### --- INPUT ---
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = 0
        tap-to-click = 1
    }
}

#THEME
env = GTK_THEME,Arc-Dark

#MOUSE SHI
env = XCURSOR_THEME,breeze_cursors
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,breeze_cursors
env = HYPRCURSOR_SIZE,24

### --- KEYBINDINGS (WINDOWS-STYLE) ---
$mainMod = SUPER

# Core Apps
bind = $mainMod, Q, exec, alacritty
bind = $mainMod, E, exec, thunar
bind = $mainMod, R, exec, rofi -show drun
bind = $mainMod, C, killactive,
bind = $mainMod, B, exec, brave

# Minimize / Restore (Special Workspace)
bind = $mainMod, H, movetoworkspacesilent, special:minimized
bind = $mainMod SHIFT, H, togglespecialworkspace, minimized

# Window Snap / Maximize
bind = $mainMod, Up, fullscreen, 0
bind = $mainMod, Down, fullscreen, 1 # Monocle (Restore-like)
bind = $mainMod, Left, movewindow, l
bind = $mainMod, Right, movewindow, r
bind = $mainMod SHIFT, Left, movewindow, l
bind = $mainMod SHIFT, Right, movewindow, r

# Alt+Tab (hyprswitch)
# GUI mode with preview
bind = ALT, Tab, exec, hyprswitch gui --mod-key alt_l --key tab --close mod-key-release --reverse-key=mod=shift
bind = ALT SHIFT, Tab, exec, hyprswitch gui --mod-key alt_l --key tab --close mod-key-release --reverse-key=mod=shift --reverse

# Workspaces (Virtual Desktops)
bind = $mainMod CTRL, Left, workspace, -1
bind = $mainMod CTRL, Right, workspace, +1
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace (Silent = Like Windows)
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Move window AND follow (Shift+Ctrl)
bind = $mainMod SHIFT CTRL, 1, movetoworkspace, 1
bind = $mainMod SHIFT CTRL, 2, movetoworkspace, 2
bind = $mainMod SHIFT CTRL, 3, movetoworkspace, 3
bind = $mainMod SHIFT CTRL, 4, movetoworkspace, 4
bind = $mainMod SHIFT CTRL, 5, movetoworkspace, 5

# Task View (Super+Tab Fallback)
bind = $mainMod, Tab, exec, rofi -show window

# Audio / Volume Control
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ && wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && ~/.config/hypr/scripts/volume_osd.sh
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && ~/.config/hypr/scripts/volume_osd.sh
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && ~/.config/hypr/scripts/volume_osd.sh
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Media Control
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Brightness Control
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 5%+ && ~/.config/hypr/scripts/brightness_osd.sh
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%- && ~/.config/hypr/scripts/brightness_osd.sh

# Fallback Keybindings (Super + Function Keys)
bindel = $mainMod, F12, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ && wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && ~/.config/hypr/scripts/volume_osd.sh
bindel = $mainMod, F11, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && ~/.config/hypr/scripts/volume_osd.sh
bindl = $mainMod, F10, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && ~/.config/hypr/scripts/volume_osd.sh
bindel = $mainMod, F6, exec, brightnessctl s 5%+ && ~/.config/hypr/scripts/brightness_osd.sh
bindel = $mainMod, F5, exec, brightnessctl s 5%- && ~/.config/hypr/scripts/brightness_osd.sh
bindl = $mainMod, F8, exec, playerctl play-pause
bindl = $mainMod, F9, exec, playerctl next
bindl = $mainMod, F7, exec, playerctl previous

# Screenshots
bind = $mainMod, U, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod SHIFT, U, exec, grim - | wl-copy

# Mouse Binds (Move/Resize with Super + Left/Right click)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

### --- WINDOW RULES (v0.55.2 Syntax) ---
# Floating common apps
windowrule = float 1, match:class ^(pavucontrol)$
windowrule = float 1, match:class ^(nm-applet)$
windowrule = float 1, match:class ^(blueman-manager)$
windowrule = float 1, match:class ^(gnome-calculator)$
windowrule = float 1, match:class ^(org.gnome.Calculator)$
windowrule = float 1, match:title ^(About).*$

# Steam (Complex Match)
windowrule {
    name = "steam-friends"
    match:class = "^(Steam)$"
    match:title = "^(Friends List)$"
    float = 1
}

# Image Viewers
windowrule = float 1, match:class ^(imv)$
windowrule = float 1, match:class ^(eog)$
windowrule = size 800 600, match:class ^(imv)$
windowrule = center 1, match:class ^(imv)$

# Video Players
windowrule = float 1, match:class ^(mpv)$
windowrule = float 1, match:class ^(vlc)$
windowrule = keep_aspect_ratio 1, match:class ^(mpv)$

# Maximized defaults
windowrule = maximize 1, match:class ^(firefox)$
windowrule = maximize 1, match:class ^(chromium)$

# Tiled defaults
windowrule = tile 1, match:class ^(kitty)$
windowrule = tile 1, match:class ^(alacritty)$

# Persistent Workspaces (Windows-like)
workspace = 1, persistent:true, name:Desktop 1
workspace = 2, persistent:true, name:Desktop 2

### --- MISC ---
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = 0x1a1b26
}
