general {
    after_sleep_cmd = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "on" }))'  # Restore the display after system sleep.
    ignore_dbus_inhibit = true                                               # Ignore Discord keeping the screen awake.
}

listener {
    timeout = 300                                                                  # 5 minutes.
    on-timeout = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "off" }))'       # Screen off; downloads continue.
    on-resume = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "on" }))'         # Restore the screen on activity.
}
