general {
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to interact twice to turn on the display.
}

listener {
    timeout = 300                                # 5 mins nigga
    on-timeout = hyprctl dispatch dpms off      # screen off (network/downloads stay active)
    on-resume = hyprctl dispatch dpms on        # screen on when activity is detected
}
